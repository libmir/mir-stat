name: Run all D Tests and Codecov

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Replace outdated PR runs, but give every master push its own coverage run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve once, then install exact versions in every DMD/LDC job. Beta jobs
  # exist only when their channel points to a prerelease newer than stable.
  compilers:
    name: Resolve compiler versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compilers: ${{ steps.resolve.outputs.compilers }}
      stable_compilers: ${{ steps.resolve.outputs.stable_compilers }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Test compiler selection
      run: python3 .github/scripts/test_compiler_matrix.py
    - name: Resolve compiler channels
      id: resolve
      run: python3 .github/scripts/compiler_matrix.py

  older-ldc:
    name: Library tests (Linux, LDC 1.28.1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Report Linux runner resources
      run: bash .github/scripts/linux-resources.sh report
    - uses: dlang-community/setup-dlang@v2.0.0
      with:
        # Keep the compiler coverage previously provided by CircleCI.
        compiler: ldc-1.28.1
    - name: Run standard library tests
      env:
        # The old frontend warns about unreachable histogram template branches.
        DFLAGS: -wi
      run: |
        ldc2 --version
        dub --version
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --compiler=ldc2 --build-mode=singleFile --parallel
    - name: Report kernel memory diagnostics on failure
      if: failure()
      run: bash .github/scripts/linux-resources.sh kernel

  gdc:
    name: GDC 15 tests
    permissions:
      contents: read
    # Ubuntu 26.04 supplies GDC 15 without an additional package repository.
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Install GDC and DUB
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends gdc-15 dub time

    - name: Report toolchain versions
      run: |
        gdc-15 --version
        dub --version

    # Optimized GDC tests are blocked by ndslice's narrow-integer
    # safety-check helper: https://github.com/libmir/mir-algorithm/issues/483
    # Revisit unittest-release coverage once the dependency fix is available.
    - name: Run standard tests
      run: |
        # DUB sizes its parallel pool from CPU affinity. Limit it to two CPUs,
        # with 6 GiB virtual memory per process to leave room for the runner.
        ulimit -v $((6 * 1024 * 1024))
        exec taskset -c 0,1 bash .github/scripts/linux-resources.sh run dub test --compiler=gdc-15 --build-mode=singleFile --parallel

    - name: Report GDC kernel memory diagnostics
      if: ${{ always() }}
      run: bash .github/scripts/linux-resources.sh kernel

  benchmarks:
    name: Benchmark tests (${{ matrix.os }}, ${{ matrix.dc.channel }})
    needs: compilers
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: ${{ fromJSON(needs.compilers.outputs.stable_compilers) }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc.compiler }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Test benchmark helpers
      run: dub -q test mir-stat:benchmark-helpers

    - name: Test benchmark cases and reporting
      run: dub -q test mir-stat:benchmarks

    # Check correctness and CLI integration, not performance on shared runners.
    - name: Smoke test release benchmarks with untransformed inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=none --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with centered inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=center --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with standardized inputs and CSV output
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=standardize --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32 --format=csv

    - name: Smoke test native D linear algebra benchmarks
      run: dub -q run mir-stat:benchmarks --config=native-d --build=release -- --function=linearAlgebra --iterations=2 --rounds=2 --warmup=1 --size=8 --format=csv

    - name: Smoke test transposed native D linear algebra benchmarks
      run: dub -q run mir-stat:benchmarks --config=native-d --build=release -- --function=linearAlgebra --layout=transposed --iterations=2 --rounds=2 --warmup=1 --size=8 --format=csv

  # Optimized compilation dominates runtime; run it alongside the other suites.
  release:
    name: Optimized release tests (${{ matrix.os }}, ${{ matrix.dc.channel }})
    env:
      CACHE_DIR: ldc-release-objects
      CACHE_PREFIX: ldc-release-v1-${{ matrix.os }}-${{ matrix.dc.compiler }}
    needs: compilers
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: ${{ fromJSON(needs.compilers.outputs.compilers) }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc.compiler }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - &restore-ldc-master
      name: Restore LDC objects from master
      if: startsWith(matrix.dc.channel, 'ldc-')
      id: master-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.temp }}/${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_PREFIX }}-${{ runner.arch }}-master-${{ github.event.pull_request.base.sha || github.sha }}
        restore-keys: ${{ env.CACHE_PREFIX }}-${{ runner.arch }}-master-

    # A draft can measure a warm rerun before master has published a cache.
    - &restore-ldc-draft
      name: Restore LDC objects from this draft
      if: startsWith(matrix.dc.channel, 'ldc-') && github.event.pull_request.draft && !steps.master-cache.outputs.cache-matched-key
      id: draft-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.temp }}/${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_PREFIX }}-${{ runner.arch }}-draft-${{ github.event.pull_request.number }}-${{ github.sha }}
        restore-keys: ${{ env.CACHE_PREFIX }}-${{ runner.arch }}-draft-${{ github.event.pull_request.number }}-

    - name: Run optimized release tests (Linux LDC)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'ldc-')
      env: &ldc-cache-flags
        DFLAGS: -cache=${{ runner.temp }}/${{ env.CACHE_DIR }}
      shell: bash
      run: |
        # DUB sizes its parallel pool from CPU affinity. Select up to four CPUs
        # from the allowed set rather than assuming CPU IDs 0-3 are available.
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')
        echo "Linux LDC build CPU affinity: $cpus (at most four compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-release --build-mode=singleFile --parallel

    - name: Run optimized release tests (Linux DMD)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'dmd-')
      shell: bash
      run: |
        # Per-file compilation reduces peak memory; bound DUB's worker pool
        # using up to three CPUs from the runner's allowed affinity set.
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:3])))')
        echo "Linux DMD build CPU affinity: $cpus (at most three compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-release --build-mode=singleFile --parallel

    - name: Run optimized release tests (Windows DMD)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: ./.github/scripts/windows-test.ps1 unittest-release

    - name: Run optimized release tests (Windows LDC)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'ldc-')
      env: *ldc-cache-flags
      shell: pwsh
      run: ./.github/scripts/windows-test.ps1 unittest-release -AllowPackage

    - name: Test scaled decay, error, gamma, and beta functions on Windows x86
      if: runner.os == 'Windows' && matrix.dc.channel == 'ldc-latest'
      shell: pwsh
      run: |
        $paths = dub describe --import-paths
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $imports = $paths | ForEach-Object { "-I$_" }
        $exe = Join-Path $env:RUNNER_TEMP 'decay-erf-log-gamma-x86.exe'
        & $env:DC -m32 -O2 -i -main -unittest --d-version=mir_stat_test @imports "-of=$exe" source/mir/stat/internal/fp_scaled_probability.d source/mir/stat/internal/fp_erf.d source/mir/stat/internal/fp_log_gamma.d source/mir/stat/internal/fp_gamma.d source/mir/stat/internal/fp_log_beta.d source/mir/stat/internal/fp_beta.d source/mir/stat/internal/fp_beta_proportion.d
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        & $exe
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $shapeExe = Join-Path $env:RUNNER_TEMP 'gamma-integer-shape-x86.exe'
        & $env:DC -m32 -i -main -unittest --d-version=mir_stat_test_gamma_integer_shape --d-version=mir_stat_test_chi2_degrees @imports "-of=$shapeExe" source/mir/stat/distribution/gamma.d source/mir/stat/distribution/chi2.d
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        & $shapeExe
        exit $LASTEXITCODE

    - name: Report Linux release kernel memory diagnostics
      if: ${{ always() && runner.os == 'Linux' }}
      run: bash .github/scripts/linux-resources.sh kernel

    - &save-ldc
      name: Save LDC objects
      if: >-
        startsWith(matrix.dc.channel, 'ldc-') &&
        ((github.event_name == 'push' && steps.master-cache.outputs.cache-hit != 'true') ||
         (github.event.pull_request.draft && !steps.master-cache.outputs.cache-matched-key && !steps.draft-cache.outputs.cache-matched-key))
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ runner.temp }}/${{ env.CACHE_DIR }}
        key: ${{ steps.draft-cache.outputs.cache-primary-key || steps.master-cache.outputs.cache-primary-key }}

  # Compile and run the full lifetime suite independently of coverage.
  lifetime:
    name: DIP1000 lifetime tests (${{ matrix.os }}, ${{ matrix.dc.channel }})
    env:
      CACHE_DIR: ldc-lifetime-objects
      CACHE_PREFIX: ldc-lifetime-v1-${{ matrix.os }}-${{ matrix.dc.compiler }}
    needs: compilers
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: ${{ fromJSON(needs.compilers.outputs.compilers) }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc.compiler }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - *restore-ldc-master
    - *restore-ldc-draft

    - name: Run DIP1000 lifetime tests (Windows DMD)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: ./.github/scripts/windows-test.ps1 unittest-dip1000

    - name: Run DIP1000 lifetime tests (Windows LDC)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'ldc-')
      env: *ldc-cache-flags
      shell: pwsh
      run: ./.github/scripts/windows-test.ps1 unittest-dip1000

    - name: Run DIP1000 lifetime tests (Linux DMD)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'dmd-')
      shell: bash
      run: |
        # DUB sizes its parallel compiler pool from the allowed CPU set.
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
        echo "Linux DMD lifetime build CPU affinity: $cpus (at most two compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-dip1000 --build-mode=singleFile --parallel

    - name: Run DIP1000 lifetime tests (Linux LDC)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'ldc-')
      env: *ldc-cache-flags
      shell: bash
      run: |
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')
        echo "Linux LDC lifetime build CPU affinity: $cpus (at most four compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-dip1000 --build-mode=singleFile --parallel

    - *save-ldc

  test:
    name: Tests with coverage (${{ matrix.os }}, ${{ matrix.dc.channel }})
    env:
      CACHE_DIR: ldc-general-coverage-objects
      CACHE_PREFIX: ldc-general-coverage-v1-${{ matrix.os }}-${{ matrix.dc.compiler }}
    needs: compilers
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: ${{ fromJSON(needs.compilers.outputs.compilers) }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc.compiler }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - *restore-ldc-master
    - *restore-ldc-draft

    - name: Run tests with coverage (Windows DMD)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'dmd-')
      shell: pwsh
      # DMD can undercount template hits in this mode: https://github.com/dlang/dmd/issues/18723
      run: ./.github/scripts/windows-test.ps1 unittest-cov

    - name: Run tests with coverage (Windows LDC)
      if: runner.os == 'Windows' && startsWith(matrix.dc.channel, 'ldc-')
      env: *ldc-cache-flags
      shell: pwsh
      run: ./.github/scripts/windows-coverage.ps1 -StableBuildPath

    - name: Run tests with coverage (Linux DMD)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'dmd-')
      run: bash .github/scripts/linux-coverage.sh

    - name: Run tests with coverage (Linux LDC)
      if: runner.os == 'Linux' && startsWith(matrix.dc.channel, 'ldc-')
      env: *ldc-cache-flags
      run: bash .github/scripts/linux-coverage.sh --stable-build-path

    # The BLAS build writes the same filenames; move the general reports first.
    # Forks run the tests; coverage is published by the upstream repository.
    - name: Preserve general coverage
      id: general-coverage
      if: ${{ !github.event.repository.fork }}
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No general coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/general'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) general coverage reports"

    - name: Summarize LDC general coverage reports
      if: startsWith(matrix.dc.channel, 'ldc-') && steps.general-coverage.outcome == 'success'
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP 'coverage/general'
        $reports = @(Get-ChildItem -LiteralPath $directory -Filter 'source-*.lst' -File | Sort-Object Name -Culture en-US)
        $manifest = foreach ($report in $reports) {
          "$($report.Name) $((Get-FileHash -LiteralPath $report.FullName).Hash)"
        }
        $digest = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($manifest -join "`n")))
        "General coverage: $($reports.Count) reports, SHA-256 $([Convert]::ToHexString($digest))" >> $env:GITHUB_STEP_SUMMARY

    # Run slow numerical sweeps once; ordinary Fp tests stay in the full matrix.
    # The focused suite makes optimized LDC faster overall than DMD.
    - name: Run slow numerical tests
      if: matrix.os == 'ubuntu-latest' && matrix.dc.channel == 'ldc-latest'
      # Keep build/link/run markers to distinguish compilation from test runtime.
      run: bash .github/scripts/linux-resources.sh run dub test mir-stat:slow-numerics --build=unittest-optimized

    - name: Install Lapack
      if: contains( matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install libopenblas-dev
      shell: bash

    - name: Run Blas Tests with coverage
      if: contains( matrix.os, 'ubuntu')
      run: bash .github/scripts/linux-resources.sh run dub -q test --build=unittest-cov-blas --config=openblas

    - name: Preserve BLAS coverage
      id: blas-coverage
      if: ${{ !github.event.repository.fork && contains(matrix.os, 'ubuntu') }}
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No BLAS coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) BLAS coverage reports"

    # Upload completed suites even if an unrelated later test failed.
    # Authenticate with the repository token; fork PRs use tokenless uploads.
    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare general coverage for upload
      id: general-upload-reports
      if: ${{ !cancelled() && steps.general-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved general coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload general coverage
      if: ${{ !cancelled() && steps.general-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.general-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: general
        name: general-${{ matrix.os }}-${{ matrix.dc.channel }}
        fail_ci_if_error: true

    - name: Remove restored general coverage
      if: ${{ always() && steps.general-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }

    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare BLAS coverage for upload
      id: blas-upload-reports
      if: ${{ !cancelled() && steps.blas-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved BLAS coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload BLAS coverage
      if: ${{ !cancelled() && steps.blas-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.blas-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: blas
        name: blas-${{ matrix.os }}-${{ matrix.dc.channel }}
        fail_ci_if_error: true

    - name: Remove restored BLAS coverage
      if: ${{ always() && steps.blas-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }

    - *save-ldc
