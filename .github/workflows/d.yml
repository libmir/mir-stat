name: Run all D Tests and Codecov

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Replace outdated PR runs, but give every master push its own coverage run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gdc:
    name: GDC 15 tests
    permissions:
      contents: read
    # Ubuntu 26.04 supplies GDC 15 without an additional package repository.
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Install GDC and DUB
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends gdc-15 dub time

    - name: Report toolchain versions
      run: |
        gdc-15 --version
        dub --version

    # Optimized GDC tests are blocked by ndslice's narrow-integer
    # safety-check helper: https://github.com/libmir/mir-algorithm/issues/483
    # Revisit unittest-release coverage once the dependency fix is available.
    - name: Run standard tests
      run: |
        # DUB sizes its parallel pool from CPU affinity. Limit it to two CPUs,
        # with 6 GiB virtual memory per process to leave room for the runner.
        ulimit -v $((6 * 1024 * 1024))
        exec taskset -c 0,1 bash .github/scripts/linux-resources.sh run dub test --compiler=gdc-15 --build-mode=singleFile --parallel

    - name: Report GDC kernel memory diagnostics
      if: ${{ always() }}
      run: bash .github/scripts/linux-resources.sh kernel

  benchmarks:
    name: Benchmark tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [dmd-latest, ldc-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Test benchmark helpers
      run: dub -q test mir-stat:benchmark-helpers

    - name: Test benchmark cases and reporting
      run: dub -q test mir-stat:benchmarks

    # Check correctness and CLI integration, not performance on shared runners.
    - name: Smoke test release benchmarks with untransformed inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=none --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with centered inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=center --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with standardized inputs and CSV output
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=standardize --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32 --format=csv

  # Optimized compilation dominates runtime; run it alongside the other suites.
  release:
    name: Release tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [ldc-latest, ldc-beta, dmd-latest, dmd-beta]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run optimized release tests (Linux LDC)
      if: runner.os == 'Linux' && startsWith(matrix.dc, 'ldc-')
      shell: bash
      run: |
        # DUB sizes its parallel pool from CPU affinity. Select up to four CPUs
        # from the allowed set rather than assuming CPU IDs 0-3 are available.
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')
        echo "Linux LDC build CPU affinity: $cpus (at most four compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-release --build-mode=singleFile --parallel

    - name: Run optimized release tests (Linux DMD)
      if: runner.os == 'Linux' && startsWith(matrix.dc, 'dmd-')
      shell: bash
      run: |
        # Per-file compilation reduces peak memory; bound DUB's worker pool
        # using up to three CPUs from the runner's allowed affinity set.
        cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:3])))')
        echo "Linux DMD build CPU affinity: $cpus (at most three compiler workers)"
        exec taskset -c "$cpus" bash .github/scripts/linux-resources.sh run dub test --build=unittest-release --build-mode=singleFile --parallel

    - name: Run optimized release tests (Windows DMD)
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      # DUB uses the system CPU count on Windows, not process affinity.
      # Use native parallelism only within the validated runner capacity.
      # Replace this capacity check with an explicit worker limit when supported:
      # https://github.com/dlang/dub/issues/3177
      run: |
        $buildArgs = @('test', '--build=unittest-release', '--build-mode=singleFile')
        try {
            $machine = Get-CimInstance Win32_ComputerSystem -OperationTimeoutSec 5 -ErrorAction Stop
            $cpus = [int]$machine.NumberOfLogicalProcessors
            if ($cpus -ge 2 -and $cpus -le 4 -and $machine.TotalPhysicalMemory -ge 12GB) {
                $buildArgs += '--parallel'
                Write-Output "Windows DMD per-file compilation: up to $cpus workers."
            } else {
                Write-Output "Windows DMD per-file compilation: sequential fallback ($cpus CPUs)."
            }
        } catch {
            Write-Warning 'Runner capacity unavailable; using sequential per-file compilation.'
        }
        ./.github/scripts/windows-resources.ps1 Run dub @buildArgs

    - name: Run optimized release tests (Windows LDC)
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'ldc-')
      shell: pwsh
      # DUB uses the system CPU count on Windows, not process affinity.
      # Bound the per-file trial to the validated runner capacity; otherwise
      # retain the default build mode until DUB supports an explicit limit:
      # https://github.com/dlang/dub/issues/3177
      run: |
        $buildArgs = @('test', '--build=unittest-release')
        try {
            $machine = Get-CimInstance Win32_ComputerSystem -OperationTimeoutSec 5 -ErrorAction Stop
            $cpus = [int]$machine.NumberOfLogicalProcessors
            if ($cpus -ge 2 -and $cpus -le 4 -and $machine.TotalPhysicalMemory -ge 12GB) {
                $buildArgs += @('--build-mode=singleFile', '--parallel')
                Write-Output "Windows LDC per-file compilation: up to $cpus workers."
            } else {
                Write-Output "Windows LDC default compilation: runner outside parallel capacity ($cpus CPUs)."
            }
        } catch {
            Write-Warning 'Runner capacity unavailable; using default compilation.'
        }
        ./.github/scripts/windows-resources.ps1 Run dub @buildArgs

    - name: Report Linux release kernel memory diagnostics
      if: ${{ always() && runner.os == 'Linux' }}
      run: bash .github/scripts/linux-resources.sh kernel

  # Compile and run the full lifetime suite independently of coverage.
  lifetime:
    name: DIP1000 lifetime tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [ldc-latest, ldc-beta, dmd-latest, dmd-beta]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run DIP1000 lifetime tests
      # Keep build/link/run markers to distinguish compilation from test execution.
      run: dub test --build=unittest-dip1000

  test:
    name: Dub Tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [ldc-latest, ldc-beta, dmd-latest, dmd-beta]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Report Linux runner resources
      if: runner.os == 'Linux'
      run: bash .github/scripts/linux-resources.sh report

    - name: Report Windows runner resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/windows-resources.ps1 Report

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run tests with coverage
      run: dub -q test --build=unittest-cov

    # The BLAS build writes the same filenames; move the general reports first.
    - name: Preserve general coverage
      id: general-coverage
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No general coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/general'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) general coverage reports"

    # Run slow numerical sweeps once; ordinary Fp tests stay in the full matrix.
    # The focused suite makes optimized LDC faster overall than DMD.
    - name: Run slow numerical tests
      if: matrix.os == 'ubuntu-latest' && matrix.dc == 'ldc-latest'
      # Keep build/link/run markers to distinguish compilation from test runtime.
      run: dub test mir-stat:slow-numerics --build=unittest-optimized

    - name: Install Lapack
      if: contains( matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install libopenblas-dev
      shell: bash

    - name: Run Blas Tests with coverage
      if: contains( matrix.os, 'ubuntu')
      run: dub -q test --build=unittest-cov-blas --config=openblas

    - name: Preserve BLAS coverage
      id: blas-coverage
      if: contains(matrix.os, 'ubuntu')
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No BLAS coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) BLAS coverage reports"

    # Upload completed suites even if an unrelated later test failed.
    # Authenticate with the repository token; fork PRs use tokenless uploads.
    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare general coverage for upload
      id: general-upload-reports
      if: ${{ !cancelled() && steps.general-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved general coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload general coverage
      if: ${{ !cancelled() && steps.general-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.general-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: general
        name: general-${{ matrix.os }}-${{ matrix.dc }}
        fail_ci_if_error: true

    - name: Remove restored general coverage
      if: ${{ always() && steps.general-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }

    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare BLAS coverage for upload
      id: blas-upload-reports
      if: ${{ !cancelled() && steps.blas-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved BLAS coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload BLAS coverage
      if: ${{ !cancelled() && steps.blas-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.blas-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: blas
        name: blas-${{ matrix.os }}-${{ matrix.dc }}
        fail_ci_if_error: true

    - name: Remove restored BLAS coverage
      if: ${{ always() && steps.blas-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }
