name: Run all D Tests and Codecov

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Replace outdated PR runs, but give every master push its own coverage run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Ddoc validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.3.0

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: dmd-latest

    - name: Build documentation with warnings as errors
      run: dub build --build=docs-check --compiler=dmd

  benchmarks:
    name: Benchmark tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [dmd-latest, ldc-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3.3.0

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Test benchmark helpers
      run: dub -q test --config=unittest-benchmark

    - name: Test benchmark cases and reporting
      run: dub -q test mir-stat:benchmarks

    # Check correctness and CLI integration, not performance on shared runners.
    - name: Smoke test release benchmarks with untransformed inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=none --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with centered inputs
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=center --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32

    - name: Smoke test release benchmarks with standardized inputs and CSV output
      run: dub -q run mir-stat:benchmarks --build=release -- --function=all --transform=standardize --algorithms=all --iterations=2 --rounds=2 --warmup=1 --size=32 --format=csv

  test:
    name: Dub Tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [ldc-latest, ldc-beta, dmd-latest, dmd-beta]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3.3.0

    - name: D Compiler Installation
      uses: dlang-community/setup-dlang@v2.0.0
      with:
        compiler: ${{ matrix.dc }}

    # setup-dlang v2 sets DC to windows/bin/dmd, bypassing bin64 on PATH.
    - name: Select 64-bit Windows DMD
      if: runner.os == 'Windows' && startsWith(matrix.dc, 'dmd-')
      shell: pwsh
      run: |
        $compiler = Join-Path (Split-Path (Split-Path $env:DC -Parent) -Parent) 'bin64/dmd.exe'
        if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing 64-bit DMD: $compiler" }
        "DC=$compiler" >> $env:GITHUB_ENV

    - name: Report toolchain versions
      shell: pwsh
      run: |
        Write-Output "DC=$env:DC"
        & $env:DC --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dub --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run tests with coverage
      run: dub -q test --build=unittest-cov

    # The BLAS build writes the same filenames; move the general reports first.
    - name: Preserve general coverage
      id: general-coverage
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No general coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/general'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) general coverage reports"

    - name: Run slow numerical tests
      if: matrix.dc == 'dmd-latest' || matrix.dc == 'ldc-latest'
      run: dub -q test --build=unittest-slow-numerics

    - name: Run DIP1000 lifetime tests
      run: dub -q test --build=unittest-dip1000

    - name: Run optimized release tests
      # Keep build/link/run markers so CI log timestamps separate build and test time.
      run: dub test --build=unittest-release

    - name: Install Lapack
      if: contains( matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install libopenblas-dev
      shell: bash

    - name: Run Blas Tests with coverage
      if: contains( matrix.os, 'ubuntu')
      run: dub -q test --build=unittest-cov-blas --config=openblas

    - name: Preserve BLAS coverage
      id: blas-coverage
      if: contains(matrix.os, 'ubuntu')
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath . -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No BLAS coverage reports found' }
        $destination = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        foreach ($report in $reports) {
          if ($report.Length -eq 0) { throw "Empty coverage report: $($report.Name)" }
          Move-Item -LiteralPath $report.FullName -Destination $destination
        }
        Write-Output "Preserved $($reports.Count) BLAS coverage reports"

    # Upload completed suites even if an unrelated later test failed.
    # Authenticate with the repository token; fork PRs use tokenless uploads.
    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare general coverage for upload
      id: general-upload-reports
      if: ${{ !cancelled() && steps.general-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved general coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload general coverage
      if: ${{ !cancelled() && steps.general-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.general-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: general
        name: general-${{ matrix.os }}-${{ matrix.dc }}
        fail_ci_if_error: true

    - name: Remove restored general coverage
      if: ${{ always() && steps.general-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/general'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }

    # Codecov's D detector requires the report to end with "covered", without a newline.
    # Trim only upload copies; keep the preserved reports unchanged.
    # Remove this workaround once https://github.com/codecov/umbrella/issues/2332 is fixed and deployed.
    - name: Prepare BLAS coverage for upload
      id: blas-upload-reports
      if: ${{ !cancelled() && steps.blas-coverage.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        $reports = @(Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File)
        if ($reports.Count -eq 0) { throw 'No preserved BLAS coverage reports found' }
        foreach ($report in $reports) {
          $content = [IO.File]::ReadAllBytes($report.FullName)
          $length = $content.Length
          while ($length -gt 0 -and ($content[$length - 1] -eq 10 -or $content[$length - 1] -eq 13)) {
            $length--
          }
          [Array]::Resize([ref]$content, $length)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $report.Name), $content)
        }
        "files=$($reports.Name -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload BLAS coverage
      if: ${{ !cancelled() && steps.blas-upload-reports.outcome == 'success' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        version: "v11.3.1"
        files: ${{ steps.blas-upload-reports.outputs.files }}
        disable_search: true
        plugins: noop
        flags: blas
        name: blas-${{ matrix.os }}-${{ matrix.dc }}
        fail_ci_if_error: true

    - name: Remove restored BLAS coverage
      if: ${{ always() && steps.blas-upload-reports.outcome == 'success' }}
      shell: pwsh
      run: |
        $source = Join-Path $env:RUNNER_TEMP 'coverage/blas'
        foreach ($report in Get-ChildItem -LiteralPath $source -Filter 'source-*.lst' -File) {
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $report.Name)
        }
