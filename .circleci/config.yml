version: 2.1

orbs:
  mirci: libmir/upload_docs@0.1.4

# The published orb has no extraction hook. Keep its workspace contract and
# upload job, but use the same package-aware adapter as the GitHub docs build.
jobs:
  test_and_build_docs:
    docker:
      - image: libmir/circle-dlang
    steps:
      - checkout
      - run:
          name: Prepare documentation templates
          command: |
            cp -r /repo/* ./
            python3 tools/prepare_doc_examples.py meson.build.1
            cat meson.build.1 >> meson.build
            cat meson_options.txt.1 >> meson_options.txt
      - run: python3 tools/test_build_docs.py
      - run: meson _build_dir_ --default-library=static -D with_test=true -D with_doc=true
      # The extractor creates ./out even when writing to stdout.
      - run: mkdir -p _build_dir_/out
      - run: ninja -C _build_dir_ test -j1
      - run: cp -r _build_dir_/web/* web/
      - persist_to_workspace:
          root: ~/project
          paths:
            - web

workflows:
  version: 2
  build-deploy:
    jobs:
      - test_and_build_docs:
          filters:
            tags:
              only: /^v(\d)+(\.(\d)+)+$/
      - mirci/upload_docs:
          to: mir-stat.libmir.org
          requires:
            - test_and_build_docs
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v(\d)+(\.(\d)+)+$/
